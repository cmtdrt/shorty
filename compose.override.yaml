services:
  db:
    ports:
      - "5432:5432"
  api:
    command: ["node", "--watch", "src/server.js"]
    read_only: false
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync
          path: ./api/src
          target: /app/src
        - action: rebuild
          path: ./api/package.json
  front:
    build:
      target: dev
    environment:
      API_URL: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
      # On aurait pu simplement ne monter que le code via "./api/src:/app/src", le node_modules étant déjà dans l'image au niveau de /app.
