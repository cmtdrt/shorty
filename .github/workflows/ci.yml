on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: shorty
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Base
        run: docker compose up -d --wait db

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        working-directory: api
        env:
          DATABASE_URL: postgres://postgres:shorty@localhost:5432/postgres
        run: |
          npm ci
          npm test

      - name: Build
        run: docker compose -f compose.yaml build

      - name: Scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
           -v trivy-cache:/root/.cache aquasec/trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 "$DOCKERHUB_USERNAME/shorty-api:$TAG"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
           -v trivy-cache:/root/.cache aquasec/trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 "$DOCKERHUB_USERNAME/shorty-front:$TAG"

      - name: Publish
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker compose -f compose.yaml push api front
